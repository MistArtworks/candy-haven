<!--
  THE CHORUS — Streamlabs chat widget · Candy Haven / Sonoalchemy
  Paste this into the widget editor's HTML tab.

  Two things here that the stock template does not have, and one it does that
  has been taken away:

  - The masthead is a sibling of #log, not part of it. Streamlabs owns the
    inside of #log entirely and clears it, so any persistent chrome has to live
    outside or it will be swept away with the messages.
  - `.index` is an extra table cell, filled by widget.js. It is deliberately
    empty here: the sequence is a property of arrival order, which only the
    renderer knows, and a token would just print the same value on every row.
  - `.meta-inner` wraps the badges and the name. The name cell is a fixed-width
    column and the two do not always both fit, so one of them has to shrink —
    and a table cell cannot be a flex container, which is what deciding *which*
    requires. Without it the name is what silently disappears; see the note in
    widget.css. It does assume Streamlabs locates `.badges` by descendant
    lookup rather than as a direct child of `.meta`, which is the one thing to
    check first if badges ever stop appearing.
  - `style="color: {color}"` is GONE. That inline style is the viewer's Twitch
    colour, which is overwhelmingly blue/green/purple and would put a sixth hue
    on screen on the first message. The raw value is kept on `data-color` so
    widget.js can map it into the locked palette instead.
-->

<div id="masthead" aria-hidden="true">
  <svg class="sigil" viewBox="0 0 24 24" focusable="false">
    <circle
      cx="12"
      cy="12"
      r="9.2"
      fill="none"
      stroke="currentColor"
      stroke-width="0.9"
      opacity="0.5"
    />
    <line
      x1="12"
      y1="0.6"
      x2="12"
      y2="23.4"
      stroke="currentColor"
      stroke-width="0.7"
      opacity="0.35"
    />
    <path
      d="M12 1.4 Q13 10.6 22.6 12 Q13 13.4 12 22.6 Q11 13.4 1.4 12 Q11 10.6 12 1.4 Z"
      fill="currentColor"
    />
  </svg>
  <span class="mast-title">The Chorus</span>
  <span class="mast-rule"></span>
  <span class="mast-note">Resonance Register</span>
</div>

<!-- item will be appended to this layout -->
<div id="log" class="sl__chat__layout"></div>

<!-- chat item -->
<script type="text/template" id="chatlist_item">
  <div data-from="{from}" data-id="{messageId}" data-color="{color}">
      <span class="index"></span>

      <span class="meta">
          <span class="meta-inner">
              <span class="badges"></span>
              <span class="name">{from}</span>
          </span>
      </span>

      <span class="message">{message}</span>
  </div>
</script>
