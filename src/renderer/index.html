<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Candy Haven</title>
    <!--
      Locked-down CSP. The renderer loads only its own bundled assets; there is
      no remote script, style or font. 'unsafe-inline' for styles is required by
      the animation libraries, which set styles on elements directly.
      https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
