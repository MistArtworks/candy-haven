<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Candy Haven</title>
    <!--
      The console's CSP minus what this window cannot do. There is no audio
      here, so `media-src blob:` is not admitted, and no remote origin is.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/vestibule.tsx"></script>
  </body>
</html>
