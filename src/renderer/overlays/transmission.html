<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Candy Haven — Now Transmitting</title>
    <!--
      Cover art arrives as a data URL inlined by the main process, which is why
      `img-src` needs no remote origin and `connect-src` stays on 'self'. A
      browser source sitting in a scene has no business reaching the internet.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>

  <body>
    <canvas id="face"></canvas>
    <script type="module" src="/src/overlays/transmission/main.ts"></script>
  </body>
</html>
