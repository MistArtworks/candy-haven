<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Candy Haven — The Concord</title>
    <!--
      Served over HTTP to an OBS browser source. `connect-src 'self'` is the only
      network permission it needs: the local event stream.

      Note what this page does *not* get, even though the feature it displays is
      driven by Twitch chat — no permission to reach Twitch, and no preload or
      IPC. Every byte of chat is read by the main process and arrives here as a
      tally, so the scene has no network reach beyond loopback and no way to be
      turned into one.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>

  <body>
    <canvas id="face"></canvas>
    <script type="module" src="/src/overlays/concord/main.ts"></script>
  </body>
</html>
