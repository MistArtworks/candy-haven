appId: app.candyhaven.desktop
productName: Candy Haven
copyright: Copyright © 2026 Candy Haven

directories:
  buildResources: build
  output: release

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!info/*'
  - '!release/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - resources/**

# Installer-time scripts must exist on disk as real files, outside the asar,
# so NSIS can invoke them. They land in $INSTDIR\resources\scripts.
extraResources:
  - from: build/scripts
    to: scripts
    filter:
      - '**/*.ps1'

win:
  executableName: candy-haven
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: CandyHaven-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Candy Haven
  uninstallDisplayName: Candy Haven
  artifactName: CandyHaven-Setup-${version}.${ext}
  include: build/installer.nsh
  deleteAppDataOnUninstall: false

npmRebuild: false

# Updates are served by this repository's GitHub Releases.
#
# Previously a generic provider pointed at https://updates.candyhaven.app, which
# has never existed — every update check the shipped app made resolved NXDOMAIN
# and failed. GitHub costs nothing, needs no server, and is already where the
# source lives.
#
# `releaseType: draft` is deliberate: a publish uploads the installer to a draft
# release rather than announcing it. Nothing is offered to an installed client
# until the release is published by hand, so a build can be uploaded, checked,
# and abandoned without anyone downloading it.
publish:
  provider: github
  owner: MistArtworks
  repo: candy-haven
  releaseType: draft
