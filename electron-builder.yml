appId: app.candyhaven.desktop
productName: Candy Haven
copyright: Copyright © 2026 Candy Haven

directories:
  buildResources: build
  output: release

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!info/*'
  - '!release/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - resources/**

# Installer-time scripts must exist on disk as real files, outside the asar,
# so NSIS can invoke them. They land in $INSTDIR\resources\scripts.
extraResources:
  - from: build/scripts
    to: scripts
    filter:
      - '**/*.ps1'

win:
  executableName: candy-haven
  # A 512x512 PNG rather than a prebuilt .ico: electron-builder generates the
  # multi-resolution icon from it, so the artwork has one source of truth
  # instead of a PNG and a hand-made .ico that drift apart.
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: CandyHaven-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Candy Haven
  uninstallDisplayName: Candy Haven
  artifactName: CandyHaven-Setup-${version}.${ext}
  include: build/installer.nsh
  deleteAppDataOnUninstall: false

npmRebuild: false

# Updates are served by this repository's GitHub Releases.
#
# Previously a generic provider pointed at https://updates.candyhaven.app, which
# has never existed — every update check the shipped app made resolved NXDOMAIN
# and failed. GitHub costs nothing, needs no server, and is already where the
# source lives.
#
# `releaseType: draft` is the review gate, and it pairs with `autoDownload`.
#
# A draft is invisible to electron-updater, so a publish uploads the installer
# without offering it to anyone. Clients have `autoDownload` on and take a new
# version unattended — which means the moment a release goes live it propagates
# with nobody watching. Pressing Publish is therefore the *only* point a human
# looks at a build before it reaches machines, and that is exactly why it should
# stay a deliberate act rather than a side effect of running a build command.
#
# It also makes electron-builder's occasional double-publish — it has raced
# itself and created two releases with the assets split between them — a
# recoverable annoyance rather than two live releases to retract.
publish:
  provider: github
  owner: MistArtworks
  repo: candy-haven
  releaseType: draft
