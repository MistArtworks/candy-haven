appId: app.candyhaven.desktop
productName: Candy Haven
copyright: Copyright © 2026 Candy Haven

directories:
  buildResources: build
  output: release

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!info/*'
  - '!release/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - resources/**

# Installer-time scripts must exist on disk as real files, outside the asar,
# so NSIS can invoke them. They land in $INSTDIR\resources\scripts.
extraResources:
  - from: build/scripts
    to: scripts
    filter:
      - '**/*.ps1'

win:
  executableName: candy-haven
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: CandyHaven-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Candy Haven
  uninstallDisplayName: Candy Haven
  artifactName: CandyHaven-Setup-${version}.${ext}
  include: build/installer.nsh
  deleteAppDataOnUninstall: false

npmRebuild: false

# Updates are served by this repository's GitHub Releases.
#
# Previously a generic provider pointed at https://updates.candyhaven.app, which
# has never existed — every update check the shipped app made resolved NXDOMAIN
# and failed. GitHub costs nothing, needs no server, and is already where the
# source lives.
#
# `releaseType: release` publishes live rather than to a draft.
#
# This started as `draft`, on the reasoning that a build should be checked before
# anyone can download it. In practice the operator ships updates continuously and
# wants the installed app to pick them up unattended, and a draft is invisible to
# electron-updater — so every release needed a manual visit to GitHub to press
# Publish, which is precisely the step that gets forgotten.
#
# The safety it traded away is real but small: a bad release is replaced by
# publishing the next one, and `autoDownload` means clients take it without being
# asked. Cut releases from a tree that builds.
publish:
  provider: github
  owner: MistArtworks
  repo: candy-haven
  releaseType: release
